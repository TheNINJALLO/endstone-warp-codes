[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "endstone-warp-codes"
version = "1.5.3"
description = "Warp Code Manager Plugin for Endstone - A complete code management system with generation, redemption, and tag management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "StoneOS", email = "contact@stoneos.net"}
]
keywords = ["endstone", "minecraft", "bedrock", "plugin", "warp", "codes"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "endstone>=0.11.9,<0.12",
]

[project.urls]
Homepage = "https://github.com/stoneos/endstone-warp-codes"
Repository = "https://github.com/stoneos/endstone-warp-codes"

[project.entry-points."endstone"]
warp-codes = "endstone_warp_codes:WarpCodeManager"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["endstone_warp_codes"]

[tool.setuptools.package-data]
endstone_warp_codes = ["*.json", "*.yml"]
